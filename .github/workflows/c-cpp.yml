name: TrollRecorder CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build TrollRecorder CLI
    runs-on: macos-15
    permissions:
      contents: read
    env:
      THEOS: ${{ github.workspace }}/theos
      THEOS_DEVICE_IP: ""

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install prerequisites
        run: |
          brew install ldid xz

      - name: Install Theos and iOS SDKs
        run: |
          git clone --depth 1 --recursive https://github.com/theos/theos.git "$THEOS"
          # Theos may already create sdks/ while cloning.
          # Reuse an existing SDK; otherwise replace only the cloned Theos SDK directory.
          if ! find "$THEOS/sdks" -maxdepth 1 -name '*.sdk' -print -quit 2>/dev/null | grep -q .; then
            rm -rf "$THEOS/sdks"
            git clone --depth 1 https://github.com/theos/sdks.git "$THEOS/sdks"
          fi
          test -f "$THEOS/makefiles/common.mk"
          test -f "$THEOS/makefiles/tool.mk"
          echo "Installed SDKs:"
          ls -1 "$THEOS/sdks"

      - name: Fix legacy C++ register keywords
        run: |
          python3 - <<'PYFIX'
          from pathlib import Path
          import re
          path = Path('cli/dtmf-decoder.mm')
          content = path.read_text()
          updated, count = re.subn(r'\bregister\s+', '', content)
          if count == 0:
              print('No legacy register keywords found; nothing to patch.')
          else:
              path.write_text(updated)
              print(f'Removed {count} legacy register keyword(s).')
          PYFIX

      - name: Build CLI tools
        run: |
          make clean
          make -j2

      - name: Upload build outputs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: trollrecorder-cli-build
          path: |
            .theos/obj/**
            packages/*.deb
          if-no-files-found: warn
